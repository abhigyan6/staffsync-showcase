services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/staffsync
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in .env}
      APP_TIMEZONE: Asia/Kolkata
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000,http://127.0.0.1:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongodb:
  uploads:
